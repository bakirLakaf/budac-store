{% if delivery_carriers %}
<section class="carriers-strip" aria-label="شركات التوصيل">
    <div class="container">
        <p class="carriers-strip-title">نوصّلو لـ58 ولاية مع</p>
        <ul class="carriers-strip-cards">
            {% for c in delivery_carriers %}
            <li>
                <a class="carrier-card" href="{{ url_for('shop.shipping_prices') }}"
                   title="{{ c.name }} — شوف الأسعار">
                    <span class="carrier-card-logo">
                        {% if c.logo %}
                        <img class="carrier-logo carrier-logo-{{ c.code }}"
                             src="{{ url_for('static', filename=c.logo) }}"
                             alt="{{ c.name }}" loading="lazy">
                        {% else %}<span class="carrier-name">{{ c.name }}</span>{% endif %}
                    </span>
                </a>
            </li>
            {% endfor %}
        </ul>
    </div>
</section>
{% endif %}
