{% extends "base.html" %}

{% block title %}{{ code }} — {{ store_name }}{% endblock %}

{% block content %}
<section class="error-page">
    <div class="container">
        <p class="error-code">{{ code }}</p>
        <h1 class="error-title">{{ title }}</h1>
        <p class="error-text">{{ message }}</p>

        <div class="error-actions">
            <a href="{{ url_for('shop.home') }}" class="btn-primary">ارجع للصفحة الرئيسية</a>
            <a href="https://wa.me/{{ whatsapp_number }}" class="btn-secondary"
               target="_blank" rel="noopener">راسلنا على واتساب</a>
        </div>
    </div>
</section>
{% endblock %}
